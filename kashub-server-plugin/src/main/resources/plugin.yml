name: KasHubServerPlugin
version: 1.0.0-FSR
main: kasperstudios.kashub.server.KasHubServerPlugin
api-version: 1.21
authors: [KasperStudios]
description: Official KasHub Server-side bridge for remote execution and scripting.

commands:
  kashub:
    description: Main command for KasHub configuration
    usage: /kashub <reload|info>
    permission: kashub.admin
    aliases: [khserver]

permissions:
  kashub.admin:
    description: Allows managing KasHub server settings
    default: op
